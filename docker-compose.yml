services:
  edge_proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      GATEWAY_PORT: "4000"
      EDGE_CONTROL_SECRET: "${EDGE_CONTROL_SECRET:-dev_docker_secret}"
    volumes:
      - ./edge_proxy/routes.json:/app/edge_proxy/routes.json:ro
    depends_on:
      - auth_app
      - billing_app
    networks:
      - mesh_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/metrics"]
      interval: 10s
      timeout: 3s
      retries: 3

  auth_app:
    build:
      context: ../auth_app
      dockerfile: Dockerfile
    environment:
      PHX_HOST: "auth.mesh.local"
      PORT: "4001"
      SECRET_KEY_BASE: "${AUTH_SECRET_KEY_BASE:-replace_with_64_char_secret}"
    expose:
      - "4001"
    networks:
      - mesh_net

  billing_app:
    build:
      context: ../billing_app
      dockerfile: Dockerfile
    environment:
      PHX_HOST: "billing.mesh.local"
      PORT: "4002"
      SECRET_KEY_BASE: "${BILLING_SECRET_KEY_BASE:-replace_with_64_char_secret}"
    expose:
      - "4002"
    networks:
      - mesh_net

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/edge_proxy_alerts.yml:/etc/prometheus/edge_proxy_alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - edge_proxy
    networks:
      - mesh_net

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mesh_net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - mesh_net
      
volumes:
  prometheus_data:
  grafana_data:

networks:
  mesh_net:
    driver: bridge
